name: CI-CD Pipeline

on: [push]

jobs:
  docker:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3
      - name: Debug SSH key
        run: |
             echo "${{ secrets.SSH_PRIVATE_KEY }}" | head -n 3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.1.81
          username: anilsk
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest
            docker stop web || true
            docker rm web || true
            docker run -d -p 80:80 --name web \
              ${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest
